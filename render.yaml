services:
  - type: web
    name: military-assets-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: military-assets-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: military-assets-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: military-assets-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: military-assets-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: military-assets-db
    plan: free
    databaseName: military_assets
    user: military_assets_app
    ipAllowList: []
