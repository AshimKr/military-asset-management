services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: military_assets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d military_assets"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
